name: Release

# A tag vX.Y.Z on main publishes that version to npm, with provenance. Needs
# the repository secret NPM_TOKEN (an npm automation token).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/zeroclaw-api-client
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag matches the package version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          grep -q "VERSION = \"${GITHUB_REF_NAME#v}\"" src/version.ts
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
