name: Release

# A tag vX.Y.Z on main publishes that version to npm through trusted
# publishing (OIDC): no token. npmjs.com lists this repository and workflow
# (release.yml, environment npm) as the package's trusted publisher, and
# provenance is generated automatically for the public repo.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/zeroclaw-api-client
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: The tag matches the package version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          grep -q "VERSION = \"${GITHUB_REF_NAME#v}\"" src/version.ts
      - run: npm ci
      - run: npm test
      - run: npm --version
      - run: npm publish --access public --loglevel verbose
